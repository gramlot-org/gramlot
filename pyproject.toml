[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gramlot"
version = "0.3.8"
description = "Declarative HTML/SVG interfaces with live data binding, authored in JavaScript or Python."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["genro-bag>=0.28.0", "genro-builders>=0.30.0", "genro-tytx>=0.16.3"]

[project.urls]
Homepage = "https://github.com/gramlot-org/gramlot"
Repository = "https://github.com/gramlot-org/gramlot"
Issues = "https://github.com/gramlot-org/gramlot/issues"
Documentation = "https://github.com/gramlot-org/gramlot/tree/main/docs/public"

[project.optional-dependencies]
test = ["genro-tytx[msgpack]", "pytest>=8"]

# The browser runtime assets in src/gramlot/resources are generated by
# `npm --prefix js run build` and are git-ignored: `artifacts` ships them anyway,
# and the build hook in hatch_build.py refuses to build without them.
[tool.hatch.build]
artifacts = [
    "/src/gramlot/resources/*.js",
    "/src/gramlot/resources/runtime-notices.json",
    "/src/gramlot/resources/themes",
    "/src/gramlot/resources/assets",
]
include = [
    "/src/gramlot/**/*.py",
    "/src/gramlot/py.typed",
    "/src/gramlot/collections/*.json",
    "/src/gramlot/resources/*.json",
    "/src/gramlot/resources/*.js",
    "/src/gramlot/resources/themes/*/*",
    "/src/gramlot/resources/assets/branding/*.svg",
    "/src/gramlot/resources/assets/branding/*.png",
    "/src/gramlot/resources/assets/branding/svg/*.svg",
    "/hatch_build.py",
    "/tests/test_*.py",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
exclude = ["/hatch_build.py", "/tests"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
