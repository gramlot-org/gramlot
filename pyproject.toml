[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gramlot"
version = "0.2.4"
description = "Portable declarative interface foundations"
requires-python = ">=3.11"
dependencies = ["genro-bag>=0.27.0", "genro-builders>=0.27.0", "genro-tytx>=0.16.0"]

[project.urls]
Homepage = "https://github.com/gramlot-org/gramlot"
Repository = "https://github.com/gramlot-org/gramlot"
Issues = "https://github.com/gramlot-org/gramlot/issues"
Documentation = "https://github.com/gramlot-org/gramlot/tree/main/docs/public"

[project.optional-dependencies]
test = ["genro-tytx[msgpack]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gramlot = [
    "resources/*.json", "resources/*.js", "collections/*.json",
    "resources/themes/*/*",
    "resources/assets/branding/*.svg", "resources/assets/branding/*.png", "resources/assets/branding/svg/*.svg",
]
