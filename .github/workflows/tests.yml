name: Core tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: gramlot

jobs:
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: gramlot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JavaScript dependencies
        run: npm --prefix js install --ignore-scripts --package-lock=false
      - name: Build browser resources
        run: npm --prefix js run build
      - name: Install Python package and test dependencies
        run: python -m pip install '.[test]'
      - name: Select Python for JavaScript interoperability tests
        run: python -c 'import os, sys; open(os.environ["GITHUB_ENV"], "a").write("GRAMLOT_TEST_PYTHON=" + sys.executable + "\n")'
      - name: Test Python
        run: python -m unittest discover -s tests
      - name: Python coverage on the source tree
        run: |
          python -m pip install coverage
          PYTHONPATH=src python -m coverage run --source=src/gramlot -m unittest discover -s tests
          python -m coverage xml -o coverage-python.xml
      - name: Test JavaScript including quiet-write and symbolic-attribute contracts, with coverage of every js/src file
        run: js/node_modules/.bin/c8 --all --src js/src --include 'js/src/**' --reporter=lcov --reporter=text-summary --report-dir coverage-js npm --prefix js test
      - name: Install Playwright Chromium for the browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-fund --no-audit playwright
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          entry="$RUNNER_TEMP/playwright/node_modules/playwright/index.mjs"
          echo "PLAYWRIGHT_ENTRY=$entry" >> "$GITHUB_ENV"
          echo "CHROMIUM=$(node --input-type=module -e "const {chromium} = await import('$entry'); console.log(chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Browser check of binding, strict CSP and iframe srcdoc in Chromium
        run: node scripts/verify_binding_browser.mjs "$PLAYWRIGHT_ENTRY" chromium
      - name: Browser check of both page logic forms on the JS and Python servers in Chromium
        run: node scripts/verify_page_module_browser.mjs python "$PLAYWRIGHT_ENTRY" chromium
      - name: Browser check of gramlot.inout in Chromium
        run: node scripts/verify_inout_browser.mjs "$PLAYWRIGHT_ENTRY" chromium
      - name: Browser checks of the live Source pages 10 and 13 on the Python and JavaScript GramlotFileServer in Chromium
        run: |
          node scripts/verify_live_cards.mjs "$PLAYWRIGHT_ENTRY" "$CHROMIUM"
          node scripts/verify_live_playground.mjs "$PLAYWRIGHT_ENTRY" "$CHROMIUM"
      - name: Upload JavaScript coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: gramlot/coverage-js/lcov.info
          flags: javascript
          disable_search: true
          fail_ci_if_error: false
      - name: Upload Python coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: gramlot/coverage-python.xml
          flags: python
          disable_search: true
          fail_ci_if_error: false
