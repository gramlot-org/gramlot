name: Core and runner tests

on:
  push:
    branches: [main, develop, 'codex/core-runner-ci']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: gramlot

jobs:
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: gramlot
      - name: Check out Serverless example dependency
        uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot-serverless
          ref: main
          path: gramlot-serverless
          persist-credentials: false
      - name: Check out JS Server example dependency
        uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot-js-server
          ref: main
          path: gramlot-js-server
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JavaScript dependencies
        run: npm --prefix js install --ignore-scripts --package-lock=false
      - name: Build browser resources
        run: npm --prefix js run build
      - name: Install Python package and test dependencies
        run: python -m pip install '.[test]'
      - name: Select Python for JavaScript interoperability tests
        run: python -c 'import os, sys; open(os.environ["GITHUB_ENV"], "a").write("GRAMLOT_TEST_PYTHON=" + sys.executable + "\n")'
      - name: Test Python
        run: python -m unittest discover -s tests
      - name: Install runner dependencies
        run: npm --prefix examples install --ignore-scripts --install-links --package-lock=false
      - name: Python coverage on the source tree
        run: |
          python -m pip install coverage
          PYTHONPATH=src python -m coverage run --source=src/gramlot -m unittest discover -s tests
          python -m coverage xml -o coverage-python.xml
      - name: Test JavaScript including quiet-write and symbolic-attribute contracts, with coverage of every js/src file
        run: js/node_modules/.bin/c8 --all --src js/src --include 'js/src/**' --reporter=lcov --reporter=text-summary --report-dir coverage-js npm --prefix js test
      - name: Test runner
        run: npm --prefix examples test
      - name: Upload JavaScript coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: gramlot/coverage-js/lcov.info
          flags: javascript
          disable_search: true
          fail_ci_if_error: false
      - name: Upload Python coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: gramlot/coverage-python.xml
          flags: python
          disable_search: true
          fail_ci_if_error: false
