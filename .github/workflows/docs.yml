name: Documentation

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/prepare_docs.py
      - run: python -m sphinx -W --keep-going -n -b html build/docs-source build/docs-site
      - run: python scripts/check_public_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-documentation
          path: build/docs-site
